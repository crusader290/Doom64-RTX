# Doom64-RTX settings. Keeping this file next to the executable makes the
# install portable (log, saves stay in the user folder; log goes next to this file).
# Put your Doom 64 ROM (.z64/.n64/.v64) in this folder, or set rom = <path>.
rom =
renderer = vulkan
raytracing = 1
widescreen = 0
brightness = 50
fullscreen = 0
width = 1280
height = 960
vsync = 1
mouse = 1
mouse_sens = 1
log = 1
sound = 1
music_volume = 70
sfx_volume = 90
sound_upgrades = 1
combat_anims = 1
imported_weapons = 1    # native SMG/rifle variants, existing ammo/pickup slots
fps = 120                # 30 (N64), 60 or 120
mouselook = 1
invert_mouse = 0
always_run = 1
autoaim = 1
crosshair = 1
jump = 1
weapon_bob = 100
ads = 1
fast_weapons = 1
gore = 1
autosave = 1
respacks = 1            # PNG resource packs from packs/
packs =                 # extra packs, ; separated

native_addons = 1
flashlight = 1
mugshot = 1
environment_fx = 1
gore_life = -1         # -1 pack default; 0 permanent; positive native 30 Hz tics
gore_limit = 128       # hard cap 128
